// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.2.20'
    ext.library_version = '1.0.7'

    repositories {
        mavenLocal()
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.3'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.6'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "de.undercouch:gradle-download-task:5.6.0"
    }
}

allprojects {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        google()
    }

    version = "$library_version"
    group = 'com.github.richard-muvirimi'
}

// Configure publishing for JitPack - only for library modules
configure(subprojects.findAll { it.name in ['library', 'base-library'] }) {
    apply plugin: 'maven-publish'

    ext.getArtifactId = { name ->
        if (name.contains('base-library')) {
            return 'base-timezonepicker'
        } else {
            return 'timezonepicker'
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                groupId project.group
                artifactId getArtifactId(project.name)
                version project.version

                afterEvaluate {
                    from components.findByName('release')
                }
            }
        }
    }
}

// Make library module the default for JitPack
if (System.getenv("JITPACK")) {
    // JitPack should build the library module by default
    defaultTasks 'library:publishToMavenLocal'
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
