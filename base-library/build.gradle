plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.android.timezonepicker'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 17
        targetSdk 36
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/src'
    }

    // Configure lint to avoid blocking JitPack builds
    lint {
        abortOnError false
        checkReleaseBuilds false
        ignoreWarnings true

        // Disable specific lint checks that are causing issues
        disable 'LongLogTag'
    }

    // Publish only the release variant and include sources jar
    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {

}

publishing {
    publications {
        maven(MavenPublication) {
            // Use the module name as artifactId so dependency coordinates match
            artifactId = project.name
            version = project.version
            // Defer component selection until after evaluation
            afterEvaluate {
                from components.release
            }
        }
    }
}

if (!System.getenv("JITPACK")) {
    tasks.register("updateGitSubmodules") {
        doFirst {
            description 'Syncs git submodules'
            exec {
                workingDir "${rootProject.rootDir.absolutePath}"
                commandLine 'git', 'submodule', 'sync', '--recursive'
            }
        }
        doLast {
            description 'Updates (and inits) git submodules'
            exec {
                workingDir "${rootProject.rootDir.absolutePath}"
                commandLine 'git', 'submodule', 'update', '--init', '--recursive'
            }
            println "Project submodules updated!"
        }
    }

    preBuild.dependsOn updateGitSubmodules
}